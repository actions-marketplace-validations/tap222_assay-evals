<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --page:#f4f5f8;--surface:#fff;--sunk:#eceef3;--line:#d8dbe4;--line-strong:#b9bdcb;
  --ink:#161a27;--ink-2:#3e4456;--muted:#646a7d;
  --accent:#3346a8;--accent-soft:#e6e9f8;--accent-ink:#24348a;
  --good:#2f6e56;--good-bg:#e2f2ea;--warn:#9a6512;--warn-bg:#fbf1dd;--bad:#b23b2e;--bad-bg:#fbe7e4;
  --band:rgba(51,70,168,.10);
  --c-ai:#3346a8;--c-est:#8f9be0;--c-fb:#c27c0e;--c-rev:#2f7d60;--c-rew:#85c2a6;--c-plat:#9097a8;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --page:#12141b;--surface:#1b1e28;--sunk:#171a23;--line:#2d3140;--line-strong:#454b5e;
  --ink:#e8eaf1;--ink-2:#c3c7d4;--muted:#9398aa;--accent:#8c9cf0;--accent-soft:#252b4a;--accent-ink:#b9c3f7;
  --good:#5fbf95;--good-bg:#183329;--warn:#e0a948;--warn-bg:#3a2c12;--bad:#ec8173;--bad-bg:#3d1f1b;
  --band:rgba(140,156,240,.14);
  --c-ai:#8c9cf0;--c-est:#4d5aa3;--c-fb:#e0a948;--c-rev:#5fbf95;--c-rew:#2f6e56;--c-plat:#6b7183}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:14.5px/1.5 var(--body)}
a{color:var(--accent-ink)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:baseline}
.brand b{font:600 22px var(--display)}
.brand span{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#12141b}}
button.link{border:0;background:none;padding:0;color:var(--accent-ink);text-decoration:underline;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav.tabs a{padding:10px 12px;color:var(--muted);font-weight:500;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .badge{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px}
h2{font:600 20px var(--display);margin:0}
h3{font:600 16px var(--display);margin:0}
.sub{color:var(--ink-2);margin:4px 0 0}
.ref{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mono{font-family:var(--mono)}
.stack{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
/* status strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.strip>div{padding:14px 16px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip b{display:block;font:600 28px var(--display);font-variant-numeric:tabular-nums;line-height:1.15}
.strip span{font-size:12.5px;color:var(--muted)}
.strip .bad b{color:var(--bad)}.strip .good b{color:var(--good)}.strip .warn b{color:var(--warn)}
@media (max-width:760px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(2){border-right:0}.strip>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
/* alert rows */
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.alert:last-child{border-bottom:0}
.alert .stripe{align-self:stretch;border-radius:2px;background:var(--bad)}
.alert.slo .stripe{background:var(--warn)}
.alert.resolved .stripe{background:var(--good)}
.alert.pending .stripe{background:var(--line-strong)}
.alert .msg{font-size:13.5px}
.alert .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap;display:inline-block}
.chip.good{color:var(--good);background:var(--good-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}.chip.neutral{color:var(--muted);background:var(--sunk)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.worse{color:var(--bad)}.better{color:var(--good)}.flat{color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
.scroll{overflow-x:auto}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:22px;color:var(--ink-2);background:var(--surface)}
code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}
/* measure cards */
.group-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:grid;gap:6px;text-align:left;cursor:pointer;position:relative;align-content:start}
.card:hover{border-color:var(--line-strong)}
.card.alerting{border-color:var(--bad)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.val b{font:600 26px var(--display);font-variant-numeric:tabular-nums}
.val small{color:var(--muted);font-size:12px}
.trend{font-family:var(--mono);font-size:11.5px}
.reason{font-size:13px;color:var(--ink-2)}
svg.spark{width:100%;height:34px;display:block}
/* detail */
.detail-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:11px var(--mono)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:10px;vertical-align:middle;margin-right:6px;border-radius:2px}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.dim h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.bar-row{display:grid;grid-template-columns:130px 1fr 120px;gap:10px;align-items:center;font-size:13px;padding:3px 4px;border-radius:5px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.bar-row:hover,.bar-row.sel{background:var(--sunk)}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .track{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar-row:hover .track,.bar-row.sel .track{background:var(--page)}
.bar-row .fill{display:block;height:100%;background:var(--accent)}
.bar-row.breach .fill{background:var(--bad)}
.bar-row.small{opacity:.55}
.bar-row .num{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.bar-row.unrec .lbl{color:var(--warn)}
.note{font-size:12.5px;color:var(--muted)}
.slo-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.slo-form input{width:110px}
/* trace */
.flags{display:grid;gap:6px}
.flag{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.facts dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
svg.timeline text{fill:var(--ink-2);font:11px var(--mono)}
.keybox{display:flex;gap:8px;align-items:center}
svg.workflow{width:100%;height:auto;display:block}
svg.workflow .wnode{cursor:pointer}
svg.workflow .wnode:hover rect:first-child,svg.workflow .wnode:focus rect:first-child{filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
svg.workflow .wnode:focus{outline:none}
svg.workflow .wtitle{font:600 13px var(--mono);fill:var(--ink)}
svg.workflow .wsub{font:11px var(--body);fill:var(--muted)}
svg.workflow .wbadge{font:600 11px var(--mono);fill:#fff}
svg.workflow .elabel{font:11px var(--mono);fill:var(--muted)}
table.lineage th.hl,table.lineage td.hl{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.pathbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pathbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:12px var(--mono);cursor:pointer}
.pathbar button.err{border-color:var(--bad);color:var(--bad);font-weight:600}
.pathbar button.fail{background:var(--bad-bg);color:var(--bad)}
.pathbar button.noop{color:var(--muted);border-style:dashed}
.pathbar button.hl{box-shadow:0 0 0 2px var(--accent)}
.pathbar .arr{color:var(--muted)}
.pathbar button.viol{border:1.5px dashed var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:600}
.contract{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.contract:last-of-type{border-bottom:0}
.contract .msg{font-size:13.5px}
.contract .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
/* failure causes */
.kindbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.kindbar i{display:block;height:100%}
.cause{display:grid;grid-template-columns:5px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cause:last-child{border-bottom:0}
.cause .stripe{border-radius:3px}
.cause.decided{opacity:.62}
.cause h3{margin:4px 0 6px;font:600 16px var(--body)}
.cause ul{margin:6px 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.cause ul li{margin:2px 0}
.cause .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cause .head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cause .count{margin-left:auto;font:600 20px var(--display);font-variant-numeric:tabular-nums}
.cause .count small{font:12px var(--mono);color:var(--muted);margin-left:6px}
.feat{display:inline-block;font:11.5px var(--mono);background:var(--sunk);border-radius:5px;padding:2px 7px;margin:2px 4px 2px 0}
.cause .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px}
.dots{font:13px var(--mono);letter-spacing:1px;white-space:nowrap}
.call{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.call .chip{font-size:12px;padding:4px 10px}
/* agents */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--sunk);border-radius:8px;padding:10px 12px}
.tile b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.traj{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.traj{grid-template-columns:1fr}}
.steps{display:grid;gap:6px}
.stp{display:grid;grid-template-columns:34px 70px minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:13px}
.stp.matched{border-left-color:var(--good)}.stp.extra{border-left-color:var(--line)}
.stp.bad{border-left-color:var(--bad)}.stp.err{border-left-color:var(--warn)}
.stp.first{box-shadow:0 0 0 2px var(--bad);}
.stp.reason{opacity:.72}
.stp .n{font:11px var(--mono);color:var(--muted);padding-top:2px}
.stp .call{font:12.5px var(--mono);overflow-wrap:anywhere}
.stp .res{font:11.5px var(--mono);color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.stp .flag{margin-top:4px;font-size:12.5px}
.okx{font:600 13px var(--mono)}.okx.y{color:var(--good)}.okx.n{color:var(--bad)}
/* learn */
.loopbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.loopbar div{flex:1 1 120px;padding:10px 12px;border-right:1px solid var(--line);background:var(--surface)}
.loopbar div:last-child{border-right:0}
.loopbar b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.loopbar span{font-size:12px;color:var(--muted)}
.loopbar .arrow{flex:0 0 auto;padding:10px 4px;color:var(--muted);align-self:center;border:0;background:none}
.prov{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:13px;align-items:baseline}
textarea.ref{width:100%;min-height:120px;font:12px/1.45 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink)}
/* connect */
.checklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.checklist div{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.checklist .ok{border-color:var(--good)}
.checklist .mark{font:600 15px var(--mono)}
.checklist .ok .mark{color:var(--good)}.checklist .no .mark{color:var(--muted)}
.progress{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--good)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;font:inherit;color:inherit}
.choice:hover{border-color:var(--line-strong)}.choice.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.choice b{font-size:14.5px}.choice span{font-size:12.5px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.intg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.intg .card{cursor:default}
.intg input{width:100%}
.suggest{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px/1.55 var(--mono);overflow-x:auto;white-space:pre}
details summary{cursor:pointer}
span.costbar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--sunk)}
span.costbar i{display:block;height:100%}
h4.dimh{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.lineage td,table.lineage th{white-space:nowrap;font-size:12.5px}
table.lineage td.v-correct{background:var(--good-bg);color:var(--good)}
table.lineage td.v-wrong{background:var(--bad-bg);color:var(--bad);font-weight:600}
table.lineage td.v-evidence{background:var(--sunk)}
@media (max-width:600px){main{padding:16px}header{padding:10px 16px}.bar-row{grid-template-columns:90px 1fr 100px}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Assay</b><span>Evaluation &amp; observability for document intelligence</span></div>
  <div class="controls">
    <select id="source" aria-label="Source"></select>
    <select id="days" aria-label="Window for manual runs"><option value="1" selected>Last 24 h</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option></select>
    <button id="run" class="primary" type="button">Run now</button>
    <span class="ref" id="updated"></span>
    <span id="me"></span>
  </div>
</header>
<main>
  <nav class="tabs">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#workflow" data-tab="workflow">Workflow</a>
    <a href="#measures" data-tab="measures">Measures</a>
    <a href="#cost" data-tab="cost">Cost</a>
    <a href="#errors" data-tab="errors">Errors</a>
    <a href="#failures" data-tab="failures">Failures</a>
    <a href="#agents" data-tab="agents">Agents</a>
    <a href="#learn" data-tab="learn">Learn</a>
    <a href="#prompts" data-tab="prompts">Prompts</a>
    <a href="#trace" data-tab="trace">Trace</a>
    <a href="#alerts" data-tab="alerts">Alerts<span class="badge" id="alert-badge" hidden></span></a>
    <a href="#gates" data-tab="gates">Release gates</a>
    <a href="#connect" data-tab="connect">Connect</a>
  </nav>
  <div id="keybox" class="panel keybox" hidden>
    <label for="apikey">This server requires an API key:</label>
    <input id="apikey" type="password" autocomplete="off">
    <button id="savekey" type="button">Use key</button>
  </div>
  <section id="tab-overview" class="stack"></section>
  <section id="tab-workflow" class="stack" hidden></section>
  <section id="tab-measures" class="stack" hidden></section>
  <section id="tab-cost" class="stack" hidden></section>
  <section id="tab-errors" class="stack" hidden></section>
  <section id="tab-failures" class="stack" hidden></section>
  <section id="tab-agents" class="stack" hidden></section>
  <section id="tab-learn" class="stack" hidden></section>
  <section id="tab-prompts" class="stack" hidden></section>
  <section id="tab-trace" class="stack" hidden></section>
  <section id="tab-alerts" class="stack" hidden></section>
  <section id="tab-gates" class="stack" hidden></section>
  <section id="tab-connect" class="stack" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={catalog:{},groups:{},overview:null,latest:null,measure:null,dim:"",val:"",trace:{view:"slowest",segment:"",doc:null}};

async function api(path,opts={}){
  const key=store.get("assay-key");
  const headers={...(opts.headers||{}),...(key?{"Authorization":"Bearer "+key}:{})};
  if(opts.body)headers["Content-Type"]="application/json";
  const r=await fetch(path,{...opts,headers});
  if(r.status===401){$("#keybox").hidden=false;throw new Error("This server needs an API key with the read scope.")}
  if(r.status===429)throw new Error("Rate limit reached; wait a moment and try again.");
  if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(typeof b.detail==="string"?b.detail:r.statusText)}
  return r.json();
}
const src=()=>$("#source").value;
// A file from the API, sent with the key (a plain link wouldn't carry it).
async function download(path,name){
  const key=store.get("assay-key");
  const r=await fetch(path,{headers:key?{"Authorization":"Bearer "+key}:{}});
  if(!r.ok)return;
  const url=URL.createObjectURL(await r.blob()),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const q=o=>new URLSearchParams(Object.entries(o).filter(([,v])=>v!==""&&v!=null)).toString();

/* ---------- formatting ---------- */
function fmt(v,unit){
  if(v==null)return"—";
  switch(unit){
    case"ratio":return (v*100).toFixed(Math.abs(v)<0.01&&v!==0?2:1)+"%";
    case"seconds":return v<60?v.toFixed(v<10?1:0)+" s":v<3600?(v/60).toFixed(0)+" min":v<172800?(v/3600).toFixed(1)+" h":(v/86400).toFixed(1)+" d";
    case"ms":return v<10000?Math.round(v).toLocaleString()+" ms":(v/1000).toFixed(1)+" s";
    case"usd":return "$"+v.toFixed(2);
    case"count":return Math.round(v).toLocaleString();
    default:return v.toFixed(3);
  }
}
function ago(iso){if(!iso)return"";const s=(Date.now()-new Date(iso+"Z").getTime())/1000;
  if(s<90)return"just now";if(s<5400)return Math.round(s/60)+" min ago";if(s<129600)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago"}
function dur(a,b){const s=(new Date((b||new Date().toISOString().slice(0,19))+"Z")-new Date(a+"Z"))/1000;return s<3600?Math.round(s/60)+" min":s<172800?(s/3600).toFixed(1)+" h":(s/86400).toFixed(1)+" d"}
const sliceName=(d,v)=>d?`${d.replace(/_/g," ")} = ${v}`:"overall";
function direction(m,delta){if(m.higher_is_better==null||Math.abs(delta)<1e-12)return"flat";return (delta>0)===m.higher_is_better?"better":"worse"}

/* ---------- charts ---------- */
function spark(points){
  const vals=points.map(p=>p.value).filter(v=>v!=null);if(vals.length<2)return"";
  const min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,W=240,H=34,p=3;
  const pts=points.map((pt,i)=>pt.value==null?null:[p+i*(W-2*p)/(points.length-1),H-p-(pt.value-min)/span*(H-2*p)]).filter(Boolean);
  const d=pts.map((x,i)=>(i?"L":"M")+x[0].toFixed(1)+","+x[1].toFixed(1)).join(" "),last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0]},${H} L${pts[0][0]},${H} Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function chart(h,m){
  const pts=h.points.filter(p=>p.value!=null);
  if(pts.length<2)return`<p class="note">Not enough history to draw yet. Each run adds a point.</p>`;
  const W=900,H=240,L=64,R=16,T=12,B=28;
  let lo=Math.min(...pts.map(p=>p.value)),hi=Math.max(...pts.map(p=>p.value));
  if(h.band){lo=Math.min(lo,h.band.low);hi=Math.max(hi,h.band.high)}
  if(h.slo){lo=Math.min(lo,h.slo.target);hi=Math.max(hi,h.slo.target)}
  if(m.unit==="ratio"||m.unit==="count"||m.unit==="ms"||m.unit==="seconds"||m.unit==="psi")lo=Math.max(0,lo);
  const pad=(hi-lo)*0.08||Math.abs(hi)*0.1||1;lo=Math.max(m.unit==="ratio"||m.unit==="count"?0:lo-pad,lo-pad);hi+=pad;
  if(m.unit==="ratio")hi=Math.min(hi,1.02);
  const t0=new Date(pts[0].at).getTime(),t1=new Date(pts[pts.length-1].at).getTime()||t0+1;
  const x=t=>L+(new Date(t).getTime()-t0)/((t1-t0)||1)*(W-L-R),y=v=>T+(1-(v-lo)/((hi-lo)||1))*(H-T-B);
  let g="";
  // One axis unit for every tick: switch ms to s, and seconds to hours, based on the top of the range.
  const axis=v=>m.unit==="ms"&&hi>=10000?(v/1000).toFixed(1)+" s":m.unit==="seconds"&&hi>=3600?(v/3600).toFixed(1)+" h":fmt(v,m.unit);
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${esc(axis(v))}</text>`}
  const ticks=Math.min(6,pts.length);for(let i=0;i<ticks;i++){const p=pts[Math.round(i*(pts.length-1)/(ticks-1||1))];g+=`<text x="${x(p.at)}" y="${H-8}" text-anchor="middle">${p.at.slice(5,10)}</text>`}
  if(h.band){const bx=x(pts[Math.max(0,pts.length-1-h.band.points)].at);g+=`<rect x="${bx}" y="${y(Math.min(h.band.high,hi))}" width="${W-R-bx}" height="${Math.max(0,y(Math.max(h.band.low,lo))-y(Math.min(h.band.high,hi)))}" fill="var(--band)"/>`}
  (h.changes||[]).forEach((c,i)=>{const t=new Date(c.at).getTime();if(t<t0||t>t1)return;const xx=x(c.at);
    g+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H-B}" stroke="var(--next,#7a4fb0)" stroke-width="1.2" stroke-dasharray="3 3"><title>${esc(c.prompt_id)} ${esc(c.version)} went live${c.note?": "+esc(c.note):""}</title></line><text x="${xx>W-R-170?xx-4:xx+4}" text-anchor="${xx>W-R-170?"end":"start"}" y="${T+12+(i%3)*12}" style="fill:var(--accent-ink)">${esc(c.prompt_id)} ${esc(c.version)}</text>`});
  if(h.slo)g+=`<line x1="${L}" x2="${W-R}" y1="${y(h.slo.target)}" y2="${y(h.slo.target)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(h.slo.target)-5}" text-anchor="end" style="fill:var(--warn)">SLO ${esc(fmt(h.slo.target,m.unit))}</text>`;
  const d=pts.map((p,i)=>(i?"L":"M")+x(p.at).toFixed(1)+","+y(p.value).toFixed(1)).join(" ");
  g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  g+=pts.map((p,i)=>{const last=i===pts.length-1,out=last&&h.band&&(p.value<h.band.low||p.value>h.band.high);
    return `<circle cx="${x(p.at)}" cy="${y(p.value)}" r="${last?4.5:2.5}" fill="${out?"var(--bad)":"var(--accent)"}"><title>${esc(p.at.slice(0,16).replace("T"," "))} · ${esc(fmt(p.value,m.unit))} · n=${p.n}</title></circle>`}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} over time">${g}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>value per run</span>${h.band?`<span><i style="background:var(--band)"></i>expected range from the last ${h.band.points} runs</span>`:""}${h.slo?`<span><i style="border-top:2px dashed var(--warn);height:0"></i>SLO target</span>`:""}${(h.changes||[]).length?`<span><i style="border-top:2px dashed var(--accent-ink);height:0"></i>a prompt version went live</span>`:""}</div>`;
}

async function refresh(){
  if(!src()){renderEmpty();return}
  try{S.overview=await api(`/v1/overview?${q({source:src()})}`)}catch(e){S.overview=null;renderEmpty(e.message);return}
  try{S.latest=await api(`/v1/runs/latest?${q({source:src()})}`)}catch(e){S.latest=null}

function renderEmpty(msg){

/* ---------- overview ---------- */
function alertRow(a,{actions=true}={}){
  const m=S.catalog[a.measure_id]||{name:a.measure_id};
  const since=a.state==="resolved"?`resolved ${ago(a.resolved_at)} · lasted ${dur(a.opened_at,a.resolved_at)}`:`${a.state==="pending"?"pending since":"open for"} ${dur(a.opened_at)} · last seen ${ago(a.last_seen_at)}`;
  return `<div class="alert ${a.kind} ${a.state}"><span class="stripe"></span>
    <div><div class="msg">${esc(a.message)}</div><div class="meta">${a.kind==="slo"?"SLO breach":a.kind==="regression"?`Prompt regression · <a href="#prompts">compare versions</a>`:a.kind==="contract"?"Path contract broken":"Anomaly"} · ${esc(since)}${a.n?` · n=${a.n}`:""}</div></div>
    ${!actions?"":a.kind==="contract"?`<a class="link" href="#workflow">Investigate</a>`:`<button class="link" type="button" data-open="${esc(a.measure_id)}" data-dim="${esc(a.dimension||"")}" data-val="${esc(a.slice_value||"")}">Investigate</button>`}</div>`;
}
// One line per measure and dimension, however many slices breach it.
function sloGroups(list){
  const groups={};list.forEach(a=>(groups[a.measure_id+"|"+(a.dimension||"")]??=[]).push(a));
  return Object.values(groups).map(g=>{
    if(g.length===1)return alertRow(g[0]);
    const m=S.catalog[g[0].measure_id],dim=g[0].dimension,worst=[...g].sort((a,b)=>m.higher_is_better?a.value-b.value:b.value-a.value);
    return `<div class="alert slo open"><span class="stripe"></span><div>
      <div class="msg">${esc(m.name)}: ${g.length} ${esc(dim.replace(/_/g," "))} slices breach the SLO of ${m.higher_is_better?"≥":"≤"} ${esc(fmt(g[0].target,m.unit))}.</div>
      <div class="meta">${worst.map(a=>`${esc(a.slice_value)} ${esc(fmt(a.value,m.unit))}`).join(" · ")}</div></div>
      <button class="link" type="button" data-open="${esc(m.id)}" data-dim="${esc(dim)}" data-val="${esc(worst[0].slice_value)}">Investigate</button></div>`}).join("");
}

const COMP_COLOR={"ai_inference":"var(--c-ai)","ai_estimated":"var(--c-est)","fallback":"var(--c-fb)","review":"var(--c-rev)","rework":"var(--c-rew)","platform":"var(--c-plat)"};
const COMP_KEYS=["ai_inference","ai_estimated","fallback","review","rework","platform"];
const COMP_LABEL={"ai_inference":"AI inference","ai_estimated":"AI inference, estimated","fallback":"Fallback escalation","review":"Human review","rework":"Rework","platform":"Platform"};
function money(v){if(v==null)return"—";const a=Math.abs(v);return a>=1000?"$"+Math.round(v).toLocaleString():a>=10?"$"+v.toFixed(0):a>=1?"$"+v.toFixed(2):a>=0.01?"$"+v.toFixed(3):"$"+v.toFixed(4)}
function stackBar(per,total,max){
  return `<span class="costbar" style="width:${Math.max(2,total/max*100)}%">${COMP_KEYS.filter(k=>per[k]>0).map(k=>`<i style="width:${per[k]/total*100}%;background:${COMP_COLOR[k]}" title="${esc(COMP_LABEL[k])} ${esc(money(per[k]))}"></i>`).join("")}</span>`;
}
function stackedChart(series,points){
  // series: {key: [value per run]}, points: run timestamps
  const n=points.length;if(n<2)return`<p class="note">Not enough history yet.</p>`;
  const totals=points.map((_,i)=>COMP_KEYS.reduce((s,k)=>s+(series[k]?.[i]||0),0));
  // Round the axis to a 1/2/5 step so ticks read as $0.50, $1.00, ...
  const raw=Math.max(...totals)/4||1,mag=10**Math.floor(Math.log10(raw)),step=[1,2,5,10].map(m=>m*mag).find(s=>s>=raw);
  const max=step*4,W=900,H=220,L=60,R=12,T=10,B=26,bw=(W-L-R)/n;
  const y=v=>T+(1-v/max)*(H-T-B);let g="";
  for(let i=0;i<=4;i++){const v=step*i,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${esc(money(v))}</text>`}
  points.forEach((at,i)=>{let base=0;const x=L+i*bw+bw*0.12,w=bw*0.76;
    COMP_KEYS.forEach(k=>{const v=series[k]?.[i]||0;if(!v)return;g+=`<rect x="${x}" y="${y(base+v)}" width="${w}" height="${y(base)-y(base+v)}" fill="${COMP_COLOR[k]}"><title>${esc(at.slice(0,10))} · ${esc(COMP_LABEL[k])} ${esc(money(v))}</title></rect>`;base+=v});
    const every=Math.ceil(n/7);
    if(i%every===0&&(n-1-i>=every/2||i===n-1)||i===n-1)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${at.slice(5,10)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost per document by component over time">${g}</svg>`;
}
async function renderCost(){
  const days=+(store.get("assay-cost-days")||7),by=store.get("assay-cost-by")||"document_type";
  const L=S.latest?.measures||{};

    <div class="legend">${COMP_KEYS.map(k=>`<span><i style="background:${COMP_COLOR[k]}"></i>${esc(COMP_LABEL[k])}${ov?` · ${esc(money(ov.per_document[k]))}`:""}</span>`).join("")}</div>
  </div>
  <div class="two">

        ${(bd.models||[]).length?`<div class="scroll"><table><tr><th>Model</th><th class="num">Spend</th><th class="num">As fallback</th></tr>
          ${bd.models.map(m=>`<tr><td class="mono">${esc(m.model)}</td><td class="num">${esc(money(m.usd))}</td><td class="num ${m.fallback_usd>0?"worse":""}">${m.fallback_usd?esc(money(m.fallback_usd)):"—"}</td></tr>`).join("")}</table></div>`:`<p class="note">No priced AI calls.</p>`}

        <span class="costbar" style="width:${tot/max*100}%;height:14px">${Object.keys(VERDICT).filter(v=>c[v]).map(v=>`<i style="width:${c[v]/tot*100}%;background:${VERDICT[v][1]}" title="${esc(VERDICT[v][0])}: ${c[v]}"></i>`).join("")}</span>
        <span class="num">${tot}</span></div>`}).join("")}</div>
    <div class="legend">${Object.entries(VERDICT).filter(([v])=>s.by_verdict.some(([x])=>x===v)).map(([v,[l,c,d]])=>`<span title="${esc(d)}"><i style="background:${c}"></i>${esc(l)} · ${s.by_verdict.find(([x])=>x===v)[1]}</span>`).join("")}</div>
  </div>
  <div class="two">
    <div class="panel"><div class="panel-head"><h2>Breakdown</h2></div>
      <div class="dims" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
        ${table("By field",s.by_field)}${table("By document type",s.by_document_type)}${table("By segment",s.by_segment)}
        <div><h4 class="dimh">Model at the origin step</h4><table>${s.by_origin_model.slice(0,8).map(m=>`<tr><td><span class="mono">${esc(m.stage)}</span><br><span class="ref">${esc(m.model)}</span></td><td class="num">${m.errors}</td></tr>`).join("")}</table></div>
      </div></div>
    <div class="panel stack" style="align-content:start"><div class="panel-head"><div><h2>Report a wrong value</h2><p class="sub">Assay traces it immediately. Reviewers, QA and support can all use this; pipelines use <code>POST /v1/errors</code>.</p></div></div>${reportForm()}</div>
  </div>
  <div class="panel"><div class="panel-head"><h2>Recent errors</h2><span class="ref">click a document to see every step's values</span></div>
    ${s.recent.slice(0,40).map(r=>errorCard(r)).join("")||`<p class="note">None yet.</p>`}</div>`;
  $("#err-days").onchange=e=>{store.set("assay-err-days",e.target.value);renderErrors()};
  wireReport(renderErrors);
}

function pct(v,d=2){return v==null?"—":(v*100).toFixed(d)+"%"}
function change(c){if(!c)return"";const x=c.change;return `<span class="ref ${x>0.05?"worse":x<-0.05?"better":""}">${x>0?"+":""}${(x*100).toFixed(0)}%</span>`}

/* ---------- workflow ---------- */
const HEALTH={ok:"var(--good)",warn:"var(--warn)",bad:"var(--bad)"};
const dominant=v=>Object.entries(v||{}).sort((a,b)=>b[1]-a[1])[0]?.[0];
// The pipeline as a graph. Ranks go left to right and wrap into rows so a
// 20-step pipeline stays readable; steps sharing a rank (branches) stack.
function flowGraph(g,{selected=null,compact=false}={}){
  const nodes=g.nodes,byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const ranks=[...new Set(nodes.map(n=>Math.round(n.position)))].sort((a,b)=>a-b);
  const perRow=compact?7:5,BW=compact?150:196,BH=compact?58:92,GX=compact?34:52,GY=compact?46:70,PAD=14;
  const col={},rowOf={},stack={};
  ranks.forEach((r,i)=>{const row=Math.floor(i/perRow);nodes.filter(n=>Math.round(n.position)===r).forEach((n,k)=>{col[n.id]=i%perRow;rowOf[n.id]=row;stack[n.id]=k})});
  const rows=Math.max(...Object.values(rowOf))+1;
  const maxStack=r=>Math.max(1,...nodes.filter(n=>rowOf[n.id]===r).map(n=>stack[n.id]+1));
  const rowY=[];let yAcc=PAD;for(let r=0;r<rows;r++){rowY.push(yAcc);yAcc+=maxStack(r)*(BH+14)+GY}
  const W=PAD*2+perRow*BW+(perRow-1)*GX,H=yAcc-GY+PAD;
  const pos=id=>({x:PAD+col[id]*(BW+GX),y:rowY[rowOf[id]]+stack[id]*(BH+14)});
  let s="";
  g.edges.forEach(e=>{if(!byId[e.from]||!byId[e.to])return;const a=pos(e.from),b=pos(e.to);
    const w=1+5*e.share,hot=selected&&(e.from===selected||e.to===selected),viol=e.violations>0;
    let d,lx,ly;
    if(rowOf[e.from]===rowOf[e.to]&&col[e.to]>col[e.from]){const x1=a.x+BW,y1=a.y+BH/2,x2=b.x,y2=b.y+BH/2;d=`M${x1},${y1} C${x1+GX/2},${y1} ${x2-GX/2},${y2} ${x2},${y2}`;lx=(x1+x2)/2;ly=(y1+y2)/2-6}
    else{const x1=a.x+BW/2,y1=a.y+BH,x2=b.x+BW/2,y2=b.y;const my=rowY[rowOf[e.to]]-GY/2;d=`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;lx=(x1+x2)/2;ly=my-4}
    s+=`<path d="${d}" fill="none" stroke="${viol?"var(--bad)":hot?"var(--accent)":"var(--line-strong)"}" stroke-width="${Math.max(w,viol?2:0).toFixed(1)}" opacity="${hot||viol?1:.8}" ${viol?`stroke-dasharray="6 4"`:""} marker-end="url(#arrow)">${viol?`<title>${e.violations} document(s) broke a path contract here</title>`:""}</path>`;
    if(e.share<0.98&&!compact)s+=`<text x="${lx}" y="${ly}" text-anchor="middle" class="elabel">${e.documents.toLocaleString()} (${Math.round(e.share*100)}%)</text>`});
  nodes.forEach(n=>{const {x,y}=pos(n.id),sel=n.id===selected,err=n.errors||0,v=dominant(n.errors_by_verdict);
    const term=n.kind==="start"||n.kind==="end",cv=n.contract_violations||[];
    const cvN=cv.reduce((a,v)=>a+v.documents,0);
    const cvText=cv.every(v=>v.kind==="must_include")?`✕ ${cvN} skipped it`:`✕ ${cvN} broke ${cv.length>1?cv.length+" contracts":"contract"}`;
    s+=`<g class="wnode" data-step="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.id)}">
      <rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="${term?BH/2:8}" fill="var(--surface)" stroke="${sel?"var(--accent)":term?"var(--line-strong)":HEALTH[n.health]}" stroke-width="${sel?3:term?1.2:2}"/>
      ${term?"":`<rect x="${x}" y="${y}" width="5" height="${BH}" rx="2" fill="${HEALTH[n.health]}"/>`}
      <text x="${x+(term?BW/2:14)}" y="${y+(compact?20:22)}" text-anchor="${term?"middle":"start"}" class="wtitle">${esc(term?(n.kind==="start"?"Received":"Done"):n.id)}</text>
      ${term?`<text x="${x+BW/2}" y="${y+(compact?38:44)}" text-anchor="middle" class="wsub">${n.kind==="start"?`${n.documents.toLocaleString()} documents`:`${n.documents.toLocaleString()} completed · ${n.open_documents.toLocaleString()} open`}</text>
        ${n.kind==="end"&&err&&!compact?`<text x="${x+BW/2}" y="${y+64}" text-anchor="middle" class="wsub" style="fill:var(--warn)">${err} error${err>1?"s":""} after the pipeline</text>`:""}`
      :`<text x="${x+14}" y="${y+(compact?38:42)}" class="wsub">${n.documents.toLocaleString()} docs · ${(n.failure_rate*100).toFixed(1)}% failed${n.noop_rate>0.5?" · did nothing":""}</text>
        ${compact?"":`<text x="${x+14}" y="${y+60}" class="wsub">${n.duration_p95_s!=null?`p95 ${esc(fmt(n.duration_p95_s,"seconds"))}`:""}${n.cost_per_document?` · ${esc(money(n.cost_per_document))}/doc`:""}${n.fallback_rate?` · ${(n.fallback_rate*100).toFixed(0)}% fallback`:""}</text>
        ${n.prompt?`<text x="${x+14}" y="${y+78}" class="wsub" style="fill:${n.regression?"var(--bad)":"var(--accent-ink)"}">${n.regression?"⚠ ":""}${esc(n.prompt)}</text>`:""}`}`}
      ${err?`<g><rect x="${x+BW-(compact?38:46)}" y="${y-9}" width="${compact?44:54}" height="20" rx="10" fill="${VERDICT[v]?.[1]||"var(--bad)"}"/><text x="${x+BW-(compact?16:19)}" y="${y+5}" text-anchor="middle" class="wbadge">${err} err</text></g>`:""}
      ${(n.open_alerts||[]).length?`<circle cx="${x+10}" cy="${y+9}" r="6" fill="var(--bad)"><title>${n.open_alerts.length} open alert(s)</title></circle>`:""}
      ${cv.length?`<rect x="${x-5}" y="${y-5}" width="${BW+10}" height="${BH+10}" rx="${term?BH/2+5:12}" fill="none" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>
        <g><rect x="${x+10}" y="${y+BH-10}" width="${cvText.length*6.8+16}" height="20" rx="10" fill="${cv.some(v=>v.severity==="critical")?"var(--bad)":"var(--warn)"}"/><text x="${x+18}" y="${y+BH+4}" class="wbadge">${esc(cvText)}</text>
        <title>${esc(cv.map(v=>`${v.label}: ${v.documents} document(s)`).join("\n"))}</title></g>`:""}
    </g>`});
  return `<svg class="workflow" viewBox="0 0 ${W} ${H}" style="min-width:${compact?Math.min(W,760):Math.min(W,900)}px" role="img" aria-label="Pipeline workflow">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line-strong)"/></marker></defs>${s}</svg>`;
}
function wireFlow(root,onPick){root.querySelectorAll(".wnode").forEach(n=>{const go=()=>onPick(n.dataset.step);n.onclick=go;n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}})}

async function renderWorkflow(){
  const days=+(store.get("assay-wf-days")||7);
  let g=null,err="";try{g=await api(`/v1/workflow?${q({source:src(),days})}`)}catch(e){err=e.message}
  if(!g||g.nodes.length<=2){$("#tab-workflow").innerHTML=`<div class="empty">${esc(err||"No stage runs yet. Send stage runs (one per step per document) and the pipeline appears here.")}</div>`;return}
  const sel=S.wfStep;
  $("#tab-workflow").innerHTML=`<div class="panel stack">
    <div class="panel-head"><div><h2>Pipeline</h2><p class="sub">Drawn from what ${g.documents.toLocaleString()} documents actually did in the last ${days} days. Border color is each step's health, the badge counts reported errors that started there, and arrow width is how many documents took that path. Click a step.</p></div>
      <select id="wf-days" aria-label="Window">${[1,7,30].map(x=>`<option value="${x}" ${x===days?"selected":""}>${x} day${x>1?"s":""}</option>`).join("")}</select></div>
    <div class="scroll">${flowGraph(g,{selected:sel})}</div>
    <div class="legend"><span><i style="background:var(--good)"></i>healthy</span><span><i style="background:var(--warn)"></i>worth a look</span><span><i style="background:var(--bad)"></i>failing, alerting, or a prompt regression</span><span><i style="background:none;border:1.5px dashed var(--bad)"></i>breaks a path contract</span>${Object.entries(VERDICT).slice(0,6).map(([k,[l,c]])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}</div>
  </div><div id="wf-detail"></div><div id="wf-contracts"></div>`;
  $("#wf-days").onchange=e=>{store.set("assay-wf-days",e.target.value);renderWorkflow()};
  wireFlow($("#tab-workflow"),st=>{location.hash="workflow/"+encodeURIComponent(st)});
  if(sel)renderStepDetail(g,sel,days);
  renderContracts(g,days);
}
async function renderStepDetail(g,stage,days){
  const n=g.nodes.find(x=>x.id===stage),box=$("#wf-detail");if(!n){box.innerHTML="";return}
  const errs=await api(`/v1/workflow/steps/${encodeURIComponent(stage)}/errors?${q({source:src(),days})}`).catch(()=>[]);
  const term=n.kind==="start"||n.kind==="end";
  const link=d=>`#trace/${encodeURIComponent(d)}/${encodeURIComponent(stage)}`;
  box.innerHTML=`<div class="panel stack" style="border-color:${HEALTH[n.health]||"var(--line)"}">
    <div class="panel-head"><div><span class="ref">${term?"":"Step"}</span><h2 class="mono">${esc(term?(n.kind==="start"?"Received":"Done (after the pipeline)"):stage)}</h2></div>
      ${term?"":`<span class="chip ${n.health==="ok"?"good":n.health==="warn"?"warn":"bad"}">${n.health==="ok"?"healthy":n.health==="warn"?"worth a look":"needs attention"}</span>`}</div>
    ${term?"":`<dl class="facts">
      <div><dt>Documents</dt><dd>${n.documents.toLocaleString()}</dd></div><div><dt>Failed</dt><dd>${(n.failure_rate*100).toFixed(2)}% (${n.failed})</dd></div>
      <div><dt>Did nothing</dt><dd>${(n.noop_rate*100).toFixed(0)}%</dd></div><div><dt>p95 duration</dt><dd>${n.duration_p95_s!=null?esc(fmt(n.duration_p95_s,"seconds")):"—"}</dd></div>
      <div><dt>Model calls</dt><dd>${n.calls.toLocaleString()}${n.latency_p95_ms?` · p95 ${esc(fmt(n.latency_p95_ms,"ms"))}`:""}</dd></div><div><dt>Cost / document</dt><dd>${n.cost_per_document?esc(money(n.cost_per_document)):"—"}</dd></div>
      <div><dt>Fallback</dt><dd>${n.fallback_rate!=null?(n.fallback_rate*100).toFixed(1)+"%":"—"}</dd></div><div><dt>Models</dt><dd class="mono" style="font-size:12px">${esc(n.models.join(", ")||"—")}</dd></div>
      <div><dt>Prompt</dt><dd>${n.prompts.length?n.prompts.map(p=>`<a href="#prompts" class="mono" style="font-size:12px${n.regression?";color:var(--bad)":""}">${esc(p)}</a>`).join("<br>"):"—"}</dd></div>
    </dl>`}
    ${(n.contract_violations||[]).length?`<div><h3 style="margin-bottom:6px">Path contracts broken here</h3>${n.contract_violations.map(v=>`<div class="flag"><span class="chip ${v.severity==="critical"?"bad":"warn"}">contract</span>${esc(v.label)}: ${v.documents.toLocaleString()} document${v.documents>1?"s":""}. <a href="#workflow" onclick="setTimeout(()=>$('#wf-contracts')?.scrollIntoView({behavior:'smooth'}),60)">See which</a></div>`).join("")}</div>`:""}
    ${(n.open_alerts||[]).length?`<div><h3 style="margin-bottom:6px">Open alerts</h3>${n.open_alerts.map(a=>`<div class="flag"><span class="chip bad">${esc(a.kind)}</span>${esc(a.message)}</div>`).join("")}</div>`:""}
    <div><h3 style="margin-bottom:6px">Errors that started ${term?"after the pipeline":"here"} <span class="ref">${errs.length}${errs.length>=50?"+":""}</span></h3>
      ${n.errors_by_verdict&&Object.keys(n.errors_by_verdict).length?`<p>${Object.entries(n.errors_by_verdict).map(([v,c])=>`${vchip(v)} ${c}`).join(" &nbsp; ")}</p>`:""}
      ${errs.length?errs.slice(0,15).map(r=>errorCard({...r,origin_stage:term?null:stage})).join(""):`<p class="note">No reported errors started ${term?"after the pipeline":"at this step"}.</p>`}</div>
    ${(n.failed_documents||[]).length?`<div><h3 style="margin-bottom:6px">Recent failed runs</h3><p>${n.failed_documents.map(f=>`<a class="mono" href="${link(f.document_id)}">${esc(f.document_id)}</a> <span class="ref">${esc(f.status)}</span>`).join(" · ")}</p></div>`:""}
    ${term?"":`<p class="note">Measures for this step: <button class="link" type="button" data-open="stage_failure_rate" data-dim="stage" data-val="${esc(stage)}">failures</button> · <button class="link" type="button" data-open="call_latency_p95" data-dim="stage" data-val="${esc(stage)}">latency</button> · <button class="link" type="button" data-open="errors_by_origin" data-dim="origin_stage" data-val="${esc(stage)}">errors over time</button> · <button class="link" type="button" data-open="cost_per_document" data-dim="stage" data-val="${esc(stage)}">cost</button></p>`}

/* ---------- agents ---------- */
const MECH={unsafe_action:["Unsafe action","var(--bad)"],tool_error:["Tool error","var(--c-fb)"],looped:["Looped","var(--warn)"],
  wrong_tool:["Wrong tool","var(--c-ai)"],bad_arguments:["Wrong arguments","var(--c-est)"],gave_up:["Stopped early","var(--c-plat)"],
  ignored_result:["Ignored a tool result","var(--c-rew)"],wrong_state:["Wrong end state","var(--c-rev)"],wrong_answer:["Wrong answer","var(--line-strong)"]};
const CHECK_LABEL={answer:"Answer",end_state:"End state",tool_calls:"Tool calls",safety:"Safety",efficiency:"Efficiency"};
const jtxt=v=>v==null?"":typeof v==="string"?v:JSON.stringify(v);
const callTxt=(n,a)=>`${n}(${Object.entries(a||{}).map(([k,v])=>`${k}=${JSON.stringify(v)}`).join(", ")})`;
function delta(now,before,{pp=true,lowerBetter=false}={}){if(now==null||before==null)return"";const d=now-before;if(Math.abs(d)<1e-9)return`<span class="ref">no change</span>`;
  const worse=lowerBetter?d>0:d<0;return `<span class="${worse?"worse":"better"}">${d>0?"▲":"▼"} ${pp?(Math.abs(d)*100).toFixed(1)+" pts":before?Math.round(Math.abs(d/before)*100)+"%":Math.abs(d).toFixed(2)}</span>`}
const LIFE_CHECK={evaluation:"Couldn't evaluate",completed:"Finished",safety:"Safety",loops:"Loops",tool_errors:"Tool errors",answer:"Answer",
  end_state:"End state",tool_calls:"Tool calls",efficiency:"Efficiency"};
const lifeStatus=st=>`<span class="chip ${st==="completed"||st==null?"good":st==="running"?"neutral":st==="abandoned"?"warn":"bad"}">${esc(st||"completed")}</span>`;
// Every agent run, production or test: where it is in its lifecycle, and the latest that failed a check.
function lifecyclePanel(l){
  if(!l)return"";
  const tiles=[["Running",l.running,"not judged until they end"],["Awaiting evaluation",l.awaiting_evaluation,"ended, checked within a minute"],

}

// One trajectory, step by step, against its reference.
function renderTrajectory(t){
  const cmp=t.tool_calls,bySeq={};(cmp?.calls||[]).forEach(r=>bySeq[r.seq]=r);
  const breaks={};(t.safety||[]).forEach(b=>{if(b.seq!=null)(breaks[b.seq]??=[]).push(b)});
  const fb=t.first_bad,world=t.world||{};
  const cls=st=>{const r=bySeq[st.seq];if(st.kind==="reason")return"reason";if(st.error)return"err";if(breaks[st.seq])return"bad";
    if(!r)return"";return r.status==="matched"?"matched":["wrong_tool","bad_arguments","extra"].includes(r.status)?"bad":r.status.startsWith("error")?"err":"extra"};
  const label={reason:"think",tool:"tool",state:"state",answer:"answer"};
  const stepHtml=st=>{const r=bySeq[st.seq];
    const body=st.kind==="tool"?`<div class="call">${esc(callTxt(st.name,st.args))}</div>${st.error?`<div class="res" style="color:var(--bad)">error: ${esc(st.error)}</div>`:st.result!=null?`<div class="res" title="${esc(jtxt(st.result))}">→ ${esc(jtxt(st.result).slice(0,220))}</div>`:""}`
      :st.kind==="state"?`<div class="call">${esc((st.args||{}).op||"update")} ${esc(st.name)}</div>${st.result!=null?`<div class="res">${esc(jtxt(st.result).slice(0,200))}</div>`:""}`
      :st.kind==="answer"?`<div>${esc(st.text||"")}</div>`
      :`<div class="res">${esc(st.model||"")}${st.tokens?` · ${st.tokens.toLocaleString()} tokens`:""}${st.cost_usd?` · ${money(st.cost_usd)}`:""}${st.text?` · ${esc(st.text.slice(0,120))}`:""}</div>`;
    const notes=[];
    if(r&&r.status==="matched")notes.push(`<span class="okx y">✓</span> expected call ${r.expected_index+1}`);
    if(r&&r.status==="allowed_extra")notes.push(`<span class="ref">allowed extra</span>`);
    if(r&&r.status==="error_retried")notes.push(`<span class="ref">errored, retried later</span>`);
    if(r&&r.status==="wrong_tool")notes.push(`<span class="chip bad">wrong tool</span> expected ${esc(r.expected_tool)}`);
    if(r&&r.status==="bad_arguments")notes.push(`<span class="chip bad">wrong arguments</span> ${esc((r.diffs||[]).join("; "))}`);
    if(r&&r.status==="extra")notes.push(`<span class="chip warn">not expected</span>`);
    (breaks[st.seq]||[]).forEach(b=>notes.push(`<span class="chip ${b.severity==="critical"?"bad":"warn"}">contract</span> ${esc(b.label)}`));
    if(fb&&fb.seq===st.seq)notes.push(`<span class="chip bad">first bad step</span> ${esc(MECH[fb.mechanism][0])}`);
    return `<div class="stp ${cls(st)} ${fb&&fb.seq===st.seq?"first":""}"><span class="n">${st.seq+1}</span><span class="chip neutral">${label[st.kind]||st.kind}</span><div>${body}${notes.length?`<div class="flag">${notes.join(" · ")}</div>`:""}</div></div>`};
  const ref=t.reference,e=t.efficiency;
  return `<div class="panel stack">
    <div class="panel-head"><div><span class="ref">Agent trajectory</span><h2 class="mono" style="font-size:18px">${esc(t.trajectory_id)}</h2>
      <p class="sub">${[t.task,t.case_id&&`case ${t.case_id}`,t.attempt!=null&&`attempt ${t.attempt}`,t.run_id&&`run ${t.run_id}`].filter(Boolean).map(esc).join(" · ")} ${Object.entries(t.lineage||{}).map(([k,v])=>`<span class="ref">${esc(k)} ${esc(v)}</span>`).join(" ")}</p></div>
      ${(()=>{const bad=[...t.failed.map(f=>CHECK_LABEL[f]),...(t.evaluation?.checks||[]).filter(c=>c.status==="fail"&&!CHECK_LABEL[c.check]).map(c=>LIFE_CHECK[c.check]||c.check)];
        return t.status==="running"?`<span class="chip neutral">running</span>`:`<span class="chip ${bad.length?"bad":"good"}">${bad.length?`failed: ${esc([...new Set(bad)].join(", "))}`:"passed"}</span>`})()}</div>
    ${t.status==="running"?`<p class="flag"><span class="chip neutral">running</span>Still going: it's checked when it ends.</p>`:""}
    ${t.evaluation?`<div><h3 style="margin-bottom:6px">Checked when it ended ${lifeStatus(t.evaluation.status)} <span class="ref">${esc(t.evaluation.evaluated_at.slice(0,16).replace("T"," "))}</span></h3>
      ${t.evaluation.checks.map(c=>`<div><span class="okx ${c.status==="pass"?"y":"n"}">${c.status==="pass"?"✓":"✗"}</span> ${esc(LIFE_CHECK[c.check]||c.check)}${c.reason?` <span class="ref">${esc(c.reason)}</span>`:""}</div>`).join("")}</div>`:""}
    ${fb?`<p class="flag"><span class="chip bad">first bad step</span><span><b>${esc(MECH[fb.mechanism][0])}</b>${fb.seq!=null?` at step ${fb.seq+1}`:""}: ${esc(fb.detail)}</span></p>`:""}
    <div class="traj"><div class="steps">${t.steps.map(stepHtml).join("")}</div>
      <div class="stack" style="align-content:start">
        ${ref?`<div><h3 style="margin-bottom:6px">Expected tool calls</h3>${(cmp?.expected||[]).map(x=>`<div class="flag"><span class="okx ${x.matched!=null?"y":"n"}">${x.matched!=null?"✓":"✗"}</span><span class="mono" style="font-size:12.5px">${esc(callTxt(x.tool,x.args))}</span>${x.optional?` <span class="ref">optional</span>`:""}${x.matched!=null?` <span class="ref">step ${x.matched+1}</span>`:` <span class="ref">missing</span>`}</div>`).join("")||`<p class="note">None listed.</p>`}
          ${cmp?`<p class="ref">precision ${pct(cmp.precision,0)} · recall ${pct(cmp.recall,0)} · ${cmp.in_order?"in order":"out of order"}</p>`:""}</div>
        ${t.end_state?`<div><h3 style="margin-bottom:6px">End state</h3>${t.end_state.map(a=>`<div class="flag"><span class="okx ${a.passed?"y":"n"}">${a.passed?"✓":"✗"}</span><span><span class="mono" style="font-size:12.5px">${esc(a.assertion)}</span>${a.passed?"":` <span class="ref">got ${esc(a.got)}</span>`}</span></div>`).join("")}</div>`:""}
        ${ref.answer?`<div><h3 style="margin-bottom:6px">Answer</h3><div class="flag"><span class="okx ${t.answer_ok?"y":"n"}">${t.answer_ok?"✓":"✗"}</span><span>should ${ref.answer_match==="equals"?"be":"include"} <b>${esc(ref.answer)}</b></span></div></div>`:""}`
        :`<p class="note">No reference for this case, so only contracts and efficiency are checked. Send one to <code>POST /v1/agents/references</code>.</p>`}
        ${Object.keys(world).length?`<div><h3 style="margin-bottom:6px">World afterwards</h3>${Object.entries(world).map(([k,v])=>`<div class="res mono" style="font-size:12px">${esc(k)}: ${v.deleted?`<span class="worse">deleted</span>`:esc(jtxt(v.state).slice(0,140))}</div>`).join("")}</div>`:""}
        <div><h3 style="margin-bottom:6px">Efficiency</h3><dl class="facts">
          <div><dt>Steps</dt><dd>${e.steps}${e.budget?` / ${e.budget}`:""}</dd></div><div><dt>Tool calls</dt><dd>${e.tool_calls}</dd></div>
          <div><dt>Most identical</dt><dd>${e.max_identical}×</dd></div><div><dt>Tool errors</dt><dd>${e.tool_errors}${e.tool_errors?` (${e.recovered} recovered)`:""}</dd></div>
          <div><dt>Tokens</dt><dd>${e.tokens.toLocaleString()}</dd></div><div><dt>Cost</dt><dd>${money(e.cost_usd)}</dd></div></dl></div>
      </div></div></div>`;
}

const CALL={advance:["good","Advance"],rerun:["warn","Rerun"],hold:["warn","Hold"],rollback:["bad","Roll back"]};
