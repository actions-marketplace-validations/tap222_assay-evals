const CKINDS={must_include:"Every document runs a step",never:"A step never runs",before:"A step runs before another",
  only_after:"A step runs only after another",max_runs:"A step runs at most N times",allowed_steps:"Only listed steps run"};
const CSTATE={broken:["bad","broken"],kept:["good","kept"],unjudged:["neutral","not checked"]};
async function renderContracts(g,days){
  const box=$("#wf-contracts");if(!box)return;
  const [rep,sh]=await Promise.all([api(`/v1/contracts?${q({source:src(),days})}`).catch(e=>({error:e.message,contracts:[]})),
    api(`/v1/contracts/shifts?${q({source:src(),days})}`).catch(()=>null)]);
  const steps=g.nodes.filter(n=>!n.kind).map(n=>n.id);
  const docLink=e=>`<a class="mono" href="#trace/${encodeURIComponent(e.document_id)}/${encodeURIComponent(e.stage)}" title="${esc(e.path.join(" → "))}">${esc(e.document_id)}</a>`;
  box.innerHTML=`<div class="panel stack">
    <div class="panel-head"><div><h2>Path contracts</h2><p class="sub">Rules about the steps a document may take, checked on every document. One break opens an alert right away. A change that breaks no rule, like a retry or a new branch, doesn't.</p></div>
      <button type="button" id="ct-suggest">Suggest from traffic</button></div>
    <div id="ct-suggestions"></div>
    <div>${rep.contracts.length?rep.contracts.map(c=>{const [cls,lbl]=CSTATE[c.state];return `<div class="contract">
      <span><span class="chip ${c.state==="broken"&&c.severity==="warning"?"warn":cls}">${lbl}</span></span>
      <div><div class="msg">${esc(c.label)}${c.severity==="warning"?` <span class="ref">· warning</span>`:""}</div>
        <div class="meta">${c.state==="broken"?`${c.violations.toLocaleString()} of ${c.judged.toLocaleString()} documents (${pct(c.rate)})`:`${c.judged.toLocaleString()} documents checked`}${c.note?` · ${esc(c.note)}`:""}</div>
        ${c.examples.length?`<div class="meta">${esc(c.examples[0].detail)}: ${c.examples.slice(0,8).map(docLink).join(" · ")}${c.violations>8?" …":""}</div>`:""}</div>
      <button class="link" type="button" data-del-contract="${c.id}">Remove</button></div>`}).join("")
      :`<p class="note">${esc(rep.error||"No contracts yet. Add one below, or let Assay suggest the ones current traffic already keeps.")}</p>`}</div>
    <details ${rep.contracts.length?"":"open"}><summary>Add a contract</summary>${contractForm(steps)}</details>
  </div>
  ${sh?`<div class="panel stack"><div class="panel-head"><div><h2>Path shifts</h2><p class="sub">How paths changed compared with the ${days} day${days>1?"s":""} before. None of these breaks a contract, so nobody is paged. If a shift is expected, leave it; if it shouldn't happen, add a contract.</p></div></div>
    ${sh.shifts.length?`<div class="flags">${sh.shifts.map(x=>`<div class="flag"><span class="chip ${x.kind==="share"?"neutral":"warn"}">${esc(x.kind.replace("_"," "))}</span>${esc(x.message)}</div>`).join("")}</div>`:`<p class="note">${esc(sh.note||"No change beyond noise.")}</p>`}</div>`:""}`;
  wireContracts(g,days);
}
function contractForm(steps){
  return `<form id="ct-form" class="slo-form" style="margin-top:10px">
    <datalist id="ct-steps">${steps.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    <select id="ct-kind" aria-label="Kind">${Object.entries(CKINDS).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select>
    <input id="ct-step" list="ct-steps" placeholder="step" aria-label="Step" style="width:150px">
    <span id="ct-other-w" hidden><input id="ct-other" list="ct-steps" placeholder="other step" aria-label="Other step" style="width:150px"></span>
    <span id="ct-max-w" hidden>at most <input id="ct-max" type="number" min="1" value="3" aria-label="At most" style="width:64px"> runs
      <label title="Count only calls with identical arguments (an agent looping)"><input type="checkbox" id="ct-ident"> identical arguments</label></span>
    <input id="ct-where" placeholder="only where args… e.g. confirmed!=true" aria-label="Argument conditions" style="width:220px" title="Agent tool calls: conditions on the step's arguments. key=value or key!=value, comma-separated">
    <span id="ct-same-w" hidden><input id="ct-same" placeholder="same args, e.g. order_id" aria-label="Arguments the other step must share" style="width:180px"></span>
    <input id="ct-list" hidden placeholder="step, step, …" aria-label="Allowed steps" style="width:100%;max-width:520px" value="${esc(steps.join(", "))}">
    <select id="ct-scope" aria-label="Scope"><option value="">for every document</option><option value="when">only when</option><option value="unless">except when</option></select>
    <span id="ct-scope-w" hidden><select id="ct-field" aria-label="Attribute"><option>segment</option><option>document_type</option><option>processing_mode</option></select>
      is <input id="ct-values" placeholder="value, value" aria-label="Values" style="width:160px"></span>
    <select id="ct-sev" aria-label="Severity"><option value="critical">critical</option><option value="warning">warning</option></select>
    <input id="ct-note" placeholder="why (optional)" aria-label="Note" style="width:180px">
    <button class="primary" type="submit">Add</button><span id="ct-msg" class="note"></span></form>`;
}
function wireContracts(g,days){
  const f=$("#ct-form"),again=()=>renderWorkflow();
  const kindUI=()=>{const k=$("#ct-kind").value;
    $("#ct-step").hidden=k==="allowed_steps";$("#ct-list").hidden=k!=="allowed_steps";
    $("#ct-other-w").hidden=!["before","only_after"].includes(k);$("#ct-same-w").hidden=!["before","only_after"].includes(k);
    $("#ct-max-w").hidden=k!=="max_runs";$("#ct-where").hidden=k==="allowed_steps"};
  if(f){$("#ct-kind").onchange=kindUI;kindUI();
    $("#ct-scope").onchange=()=>{$("#ct-scope-w").hidden=!$("#ct-scope").value};
    f.onsubmit=async e=>{e.preventDefault();const k=$("#ct-kind").value,sc=$("#ct-scope").value;
      const list=v=>v.split(",").map(x=>x.trim()).filter(Boolean);
      const body={source:src(),kind:k,severity:$("#ct-sev").value,note:$("#ct-note").value||null,
        step:k==="allowed_steps"?null:$("#ct-step").value.trim(),other:$("#ct-other").value.trim()||null,
        max_runs:k==="max_runs"?+$("#ct-max").value:null,steps:k==="allowed_steps"?list($("#ct-list").value):null};
      if(sc)body[sc]={[$("#ct-field").value]:list($("#ct-values").value)};
      const val=v=>v==="true"?true:v==="false"?false:v!==""&&!isNaN(+v)?+v:v;
      const where={};list($("#ct-where").value).forEach(c=>{const m=c.match(/^([\w.]+)\s*(!=|=)\s*(.*)$/);if(m)where[m[1]]=m[2]==="!="?{not:val(m[3])}:val(m[3])});
      if(Object.keys(where).length)body.where=where;
      if(["before","only_after"].includes(k)&&$("#ct-same").value.trim())body.same=list($("#ct-same").value);
      if(k==="max_runs"&&$("#ct-ident").checked)body.identical=true;
      try{await api("/v1/contracts",{method:"POST",body:JSON.stringify(body)});again()}
      catch(err){$("#ct-msg").textContent=err.message}}}
  document.querySelectorAll("[data-del-contract]").forEach(b=>b.onclick=async()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Remove? Click again";b.classList.add("worse");return}
    b.disabled=true;await api(`/v1/contracts/${b.dataset.delContract}`,{method:"DELETE"}).catch(e=>{b.textContent=e.message});again()});
  $("#ct-suggest").onclick=async()=>{const box=$("#ct-suggestions"),b=$("#ct-suggest");b.disabled=true;b.textContent="Reading paths…";
    try{const r=await api(`/v1/contracts/suggestions?${q({source:src(),days:30})}`);
      if(!r.suggestions.length){box.innerHTML=`<p class="note">${esc(r.note||"Nothing to add: your contracts already cover what the last 30 days of paths keep.")}</p>`;return}
      box.innerHTML=`<div class="suggest"><div class="panel-head"><div><h3>Suggested from ${r.documents.toLocaleString()} finished documents (30 days)</h3>
        <p class="sub">What current paths already keep, ignoring documents that break your contracts. Add the ones that are real rules, not coincidences.</p></div>
        <button type="button" id="ct-addall">Add all</button></div>
        ${r.suggestions.map((x,i)=>`<div class="flag"><button class="link" type="button" data-sugg="${i}">Add</button><span>${esc(x.label)} <span class="ref">${pct(x.kept_rate,1)} keep it · ${esc(x.severity)}</span></span></div>`).join("")}</div>`;
      const add=x=>api("/v1/contracts",{method:"POST",body:JSON.stringify({source:src(),...Object.fromEntries(
        ["kind","step","other","max_runs","steps","severity"].map(k=>[k,x[k]??null]))})});
      box.querySelectorAll("[data-sugg]").forEach(el=>el.onclick=async()=>{el.disabled=true;
        try{await add(r.suggestions[+el.dataset.sugg]);el.textContent="Added"}catch(e){el.textContent=e.message}});
      $("#ct-addall").onclick=async()=>{for(const x of r.suggestions)await add(x).catch(()=>null);again()};
    }catch(e){box.innerHTML=`<p class="reason">${esc(e.message)}</p>`}
    finally{b.disabled=false;b.textContent="Suggest from traffic"}};
}

/* ---------- trace ---------- */
async function renderTrace(){
  const T=S.trace;
  const views=[["slowest","Slowest"],["incomplete","Never finished"],["lost","Lost at handoff"],["recent","Most recent"]];
  let list=[],err="";
  try{list=await api(`/v1/documents?${q({source:src(),view:T.view,days:7,segment:T.segment,limit:30})}`)}catch(e){err=e.message}
  $("#tab-trace").innerHTML=`
  <div class="panel stack">
    <div class="panel-head"><div><h2>Trace a document</h2><p class="sub">Follow one document through every stage and model call, with what went wrong flagged.</p></div>
      <form id="find" class="picker"><input id="docid" placeholder="Document ID" aria-label="Document ID" value="${esc(T.doc||"")}"><button type="submit">Trace</button></form></div>
    <div class="picker">${views.map(([k,l])=>`<button type="button" class="${T.view===k?"primary":""}" data-view="${k}">${l}</button>`).join("")}
      ${T.segment?`<span class="chip neutral">segment = ${esc(T.segment)}</span> <button class="link" type="button" id="clear-segment">clear</button>`:""}<span class="ref">last 7 days</span></div>
    ${err?`<p class="reason">${esc(err)}</p>`:list.length?`<div class="scroll"><table><tr><th>Document</th><th>Received</th><th class="num">Took</th><th>Segment</th><th>Type</th><th>Mode</th></tr>
      ${list.map(d=>`<tr class="click" data-doc="${esc(d.document_id)}"><td class="mono">${esc(d.document_id)}</td><td class="ref">${esc(d.received_at.slice(0,16).replace("T"," "))}</td>
        <td class="num">${d.duration_s!=null?esc(fmt(d.duration_s,"seconds")):`<span class="warn">${esc(dur(d.received_at))} so far</span>`}</td><td>${esc(d.segment||"(unrecorded)")}</td><td>${esc(d.document_type||"—")}</td><td>${esc(d.processing_mode||"—")}</td></tr>`).join("")}</table></div>`
      :`<p class="note">${T.view==="lost"?"No lost documents, or no downstream system is configured to check against.":"No documents in this view."}</p>`}
  </div>
  <div id="trace-out"></div>`;
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{T.view=b.dataset.view;renderTrace()});
  $("#clear-segment")&&($("#clear-segment").onclick=()=>{T.segment="";renderTrace()});
  document.querySelectorAll("[data-doc]").forEach(r=>r.onclick=()=>showTrace(r.dataset.doc));
  $("#find").onsubmit=e=>{e.preventDefault();const v=$("#docid").value.trim();if(v)showTrace(v)};
  if(T.doc)showTrace(T.doc,false);
}
// What every step produced, side by side, with reported errors marked where they went wrong.
function stepByStep(ea,id){
  if(!ea)return"";
  const steps=ea.steps,errs=ea.errors||[];
  const state={};errs.forEach(r=>r.timeline.forEach(tl=>{(state[r.field]??={})[tl.index]=tl}));
  const fields=[...new Set([...ea.lineage.map(l=>l.field),...errs.map(e=>e.field)])];
  const valOf=f=>ea.lineage.find(l=>l.field===f)?.values||[];
  const anyOutputs=steps.some(s=>s.records_outputs);
  const fmtv=v=>v==null?"":typeof v==="object"?JSON.stringify(v):String(v);
  const hl=S.trace.step;
  const origins={};errs.forEach(e=>{if(e.origin_stage)(origins[e.origin_stage]??=[]).push(e.field)});
  const broke={};(S.trace.contracts||[]).forEach(v=>{if(v.at!=null)(broke[v.at]??=[]).push(v.detail)});
  const pathbar=`<div class="pathbar" id="pathbar">${steps.map((s,i)=>`${i?`<span class="arr">→</span>`:""}<button type="button" data-col="${esc(s.stage)}" class="${origins[s.stage]?"err":""} ${["failed","error","timeout","permanently_failed"].includes(s.status)?"fail":""} ${broke[i]?"viol":""} ${s.stage===hl?"hl":""}" title="${broke[i]?"Breaks a path contract: "+esc(broke[i].join("; "))+". ":""}${origins[s.stage]?"Errors started here: "+esc(origins[s.stage].join(", ")):esc(s.status)}">${i+1}. ${esc(s.stage)}${origins[s.stage]?` ✕ ${origins[s.stage].length}`:""}</button>`).join("")}<span class="arr">→</span><button type="button" class="${errs.some(e=>!e.origin_stage&&e.verdict==="after")?"err":""}" disabled>output</button></div>`;
  return `<div class="panel stack" id="stepbystep"><div class="panel-head"><div><h2>Step by step</h2><p class="sub">What each step produced for this document${errs.length?". Red is where a reported value was wrong, green where it was still right":""}.</p></div></div>
    ${pathbar}
    ${hl&&origins[hl]?`<p class="flag"><span class="chip bad">error point</span><b class="mono">${esc(hl)}</b>&nbsp;is where ${esc(origins[hl].join(", "))} went wrong on this document.</p>`:""}
    ${anyOutputs?`<div class="scroll"><table class="lineage"><tr><th>Field</th>${steps.map((s,i)=>`<th class="${s.stage===hl?"hl":""}">${i+1}. ${esc(s.stage)}${s.status!=="success"?` <span class="worse">(${esc(s.status)})</span>`:""}${s.prompt?`<br><span class="ref" style="text-transform:none;letter-spacing:0">${esc(s.prompt)}</span>`:""}</th>`).join("")}</tr>
      ${steps.some(s=>s.text)?`<tr><td class="ref">text output</td>${steps.map(s=>`<td class="ref" title="${esc(s.text||"")}">${s.text?esc(s.text.slice(0,28))+"…":""}</td>`).join("")}</tr>`:""}
      ${fields.map(f=>`<tr><td class="mono">${esc(f)}${errs.some(e=>e.field===f)?` <span class="chip bad">reported</span>`:""}</td>${steps.map((s,i)=>{const tl=state[f]?.[i],v=valOf(f)[i];
        const cls=tl?.state==="wrong"||tl?.state==="extra"?"v-wrong":tl?.state==="correct"?"v-correct":tl?.evidence?"v-evidence":"";
        return `<td class="${cls} ${s.stage===hl?"hl":""}" title="${tl?.evidence?"The right value is in this step's text":""}">${esc(fmtv(v).slice(0,40))}${tl?.evidence&&v==null?`<span class="ref">✓ in text</span>`:""}</td>`}).join("")}</tr>`).join("")}</table></div>`
      :`<p class="note">These steps didn't send their outputs, so wrong values can't be traced to a step yet. Send <code>outputs</code> with each stage run (or <code>step.output(...)</code> in the Python client).</p>`}
    ${errs.length?`<h3>Reported errors on this document</h3>${errs.map(r=>errorCard(r,{link:false})).join("")}`:""}
    <div><h3 style="margin-bottom:6px">Report a wrong value on this document</h3>${reportForm(id,fields)}</div></div>`;
}
// Clicking a step in the path bar highlights its column (and keeps it in the link).
function wireStepByStep(ea,id){
  wireReport(()=>showTrace(id,false));
  document.querySelectorAll("#pathbar [data-col]").forEach(b=>b.onclick=()=>{
    S.trace.step=b.dataset.col;
    try{history.replaceState(null,"","#trace/"+encodeURIComponent(id)+"/"+encodeURIComponent(b.dataset.col))}catch(e){}
    $("#stepbystep").outerHTML=stepByStep(ea,id);wireStepByStep(ea,id)});
}
async function showTrace(id,scroll=true){
  S.trace.doc=id;const out=$("#trace-out");
  const agent=await api(`/v1/agents/trajectories/${encodeURIComponent(id)}?${q({source:src()})}`).catch(()=>null);
  if(agent){try{history.replaceState(null,"","#trace/"+encodeURIComponent(id))}catch(e){}
    out.innerHTML=renderTrajectory(agent);if(scroll)out.scrollIntoView({behavior:"smooth",block:"start"});return}
  try{history.replaceState(null,"","#trace/"+encodeURIComponent(id))}catch(e){}
  let t,ea=null,cv=[];try{[t,ea,cv]=await Promise.all([api(`/v1/trace/${encodeURIComponent(id)}?${q({source:src()})}`),
    api(`/v1/errors/${encodeURIComponent(id)}?${q({source:src()})}`).catch(()=>null),
    api(`/v1/contracts/documents/${encodeURIComponent(id)}?${q({source:src()})}`).catch(()=>[])])}catch(e){out.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  S.trace.contracts=cv;
  const d=t.document,sev={bad:"bad",warn:"warn",info:"neutral"};
  const t0=new Date(d.received_at).getTime();
  const ends=[...t.stages.map(s=>s.finished_at),...t.calls.map(c=>c.ts),d.completed_at].filter(Boolean).map(x=>new Date(x).getTime()+0);
  const t1=Math.max(t0+1000,...ends,...t.calls.map(c=>new Date(c.ts).getTime()+(c.latency_ms||0)));
  const W=900,L=210,R=12,row=22,rows=t.stages.length+t.calls.length,H=rows*row+34;
  const x=ms=>L+(ms-t0)/(t1-t0)*(W-L-R);
  let g=`<line x1="${L}" x2="${W-R}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/><text x="${L}" y="${H-4}">received</text><text x="${W-R}" y="${H-4}" text-anchor="end">+${esc(fmt((t1-t0)/1000,"seconds"))}</text>`;
  t.stages.forEach((s,i)=>{const a=s.started_at?new Date(s.started_at).getTime():t0,b=s.finished_at?new Date(s.finished_at).getTime():a;const yy=i*row+4;
    const col=s.status&&["failed","error","permanently_failed","timeout"].includes(s.status)?"var(--bad)":s.did_work===false?"var(--line-strong)":"var(--accent)";
    g+=`<text x="${L-8}" y="${yy+13}" text-anchor="end">${esc(s.stage)}</text><rect x="${x(a)}" y="${yy+3}" width="${Math.max(3,x(b)-x(a))}" height="12" rx="2" fill="${col}"><title>${esc(s.stage)} · ${esc(s.status)}${s.did_work===false?" · did no work":""}</title></rect>`});
  t.calls.forEach((c,i)=>{const a=new Date(c.ts).getTime(),b=a+(c.latency_ms||0),yy=(t.stages.length+i)*row+4;
    const col=["failed","error","timeout"].includes(c.status)?"var(--bad)":c.model_declared&&c.model_served&&c.model_declared!==c.model_served?"var(--warn)":"var(--good)";
    g+=`<text x="${L-8}" y="${yy+13}" text-anchor="end">↳ ${esc(c.stage)} call</text><rect x="${x(a)}" y="${yy+5}" width="${Math.max(3,x(b)-x(a))}" height="8" rx="2" fill="${col}"><title>${esc(c.model_served||"")} · ${esc(fmt(c.latency_ms,"ms"))} · ${esc(c.status||"")}</title></rect>`});
  out.innerHTML=`<div class="panel stack">
    <div class="panel-head"><div><span class="ref">Trace</span><h2 class="mono" style="font-size:18px">${esc(d.document_id)}</h2></div>
      <span class="chip ${d.completed_at?"good":"warn"}">${d.completed_at?"completed":"not completed"}</span></div>
    <dl class="facts">
      <div><dt>Took</dt><dd>${d.duration_s!=null?esc(fmt(d.duration_s,"seconds")):esc(dur(d.received_at))+" so far"}</dd></div>
      <div><dt>Segment</dt><dd>${esc(d.segment||"(unrecorded)")}</dd></div><div><dt>Type</dt><dd>${esc(d.document_type||"—")}</dd></div>
      <div><dt>Mode</dt><dd>${esc(d.processing_mode||"—")}</dd></div><div><dt>AI spend</dt><dd>${esc(fmt(t.cost_usd,"usd"))}${t.calls.some(c=>c.cost_usd==null)?" (floor)":""}</dd></div>
      <div><dt>Downstream</dt><dd>${d.delivered_downstream==null?"not checked":d.delivered_downstream?"delivered":"missing"}</dd></div>
    </dl>
    ${cv.length?`<div class="flags">${cv.map(v=>`<div class="flag"><span class="chip ${v.severity==="critical"?"bad":"warn"}">contract</span><span>Breaks “${esc(v.label)}”: ${esc(v.detail)}.</span></div>`).join("")}</div>`:""}
    ${t.flags.length?`<div class="flags">${t.flags.map(f=>`<div class="flag"><span class="chip ${sev[f.severity]}">${f.severity==="info"?"note":f.severity==="bad"?"problem":"warning"}</span>${esc(f.text)}</div>`).join("")}</div>`:`<p class="note">Nothing flagged on this document.</p>`}
    <div class="scroll"><svg class="timeline" viewBox="0 0 ${W} ${H}" style="min-width:640px;width:100%">${g}</svg></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>stage did work</span><span><i style="background:var(--line-strong)"></i>stage reported success, did no work</span><span><i style="background:var(--good)"></i>AI call</span><span><i style="background:var(--warn)"></i>served by a different model</span><span><i style="background:var(--bad)"></i>failed</span></div>
    ${t.calls.length?`<div class="scroll"><table><tr><th>Stage</th><th>Declared</th><th>Served</th><th>Tier / reason</th><th class="num">Latency</th><th class="num">Cost</th><th>Status</th></tr>
      ${t.calls.map(c=>`<tr><td>${esc(c.stage)}</td><td class="ref">${esc(c.model_declared||"—")}</td><td class="ref ${c.model_declared&&c.model_served&&c.model_declared!==c.model_served?"worse":""}">${esc(c.model_served||"—")}</td>
        <td class="ref">${c.resolving_layer?esc(c.resolving_layer+" / "+(c.gate_reason||"?")):`<span class="warn">not recorded</span>`}</td><td class="num">${esc(fmt(c.latency_ms,"ms"))}</td>
        <td class="num">${c.cost_usd==null?`<span class="warn">none</span>`:esc(fmt(c.cost_usd,"usd"))}</td><td>${esc(c.status||"—")}</td></tr>`).join("")}</table></div>`:""}
  </div>`;
  out.insertAdjacentHTML("beforeend",stepByStep(ea,id));wireStepByStep(ea,id);
  if(S.trace.step){setTimeout(()=>$("#stepbystep")?.scrollIntoView({behavior:"smooth",block:"start"}),50);scroll=false}
  if(scroll)out.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- alerts ---------- */
async function renderAlerts(){
  const st=store.get("assay-alert-state")||"open";
  const list=await api(`/v1/alerts?${q({source:src(),state:st==="pending"?"all":st,limit:200})}`).catch(()=>[]);
  const shown=st==="pending"?list.filter(a=>a.state==="pending"):st==="all"?list:list.filter(a=>a.state===st);
  $("#tab-alerts").innerHTML=`<div class="panel">
    <div class="panel-head"><div><h2>Alerts</h2><p class="sub">An alert opens after its condition holds on two runs in a row (a broken path contract opens at once), and resolves on the first run where it no longer holds. Pending alerts have been seen once and haven't notified anyone.</p></div>
      <div class="picker">${["open","pending","resolved","all"].map(s=>`<button type="button" class="${s===st?"primary":""}" data-state="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</div></div>
    ${shown.length?shown.map(a=>alertRow(a)).join(""):`<p class="note">No ${st==="all"?"":st} alerts.</p>`}
  </div>`;
  document.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>{store.set("assay-alert-state",b.dataset.state);renderAlerts()});
}

/* ---------- gates ---------- */
async function renderGates(){
  const g=await api("/v1/gates").catch(()=>[]);
  $("#tab-gates").innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Release gates</h2><p class="sub">Every promote, hold or rollback decision, with the lineage that produced it. CI submits them to <code>POST /v1/gates/evaluate</code> (<a href="/docs#/default/evaluate_gate_v1_gates_evaluate_post">API docs</a>).</p></div></div>
    ${g.length?`<div class="scroll"><table><tr><th>When</th><th>Outcome</th><th>Lineage</th><th>Deciding slices</th></tr>
    ${g.map(d=>`<tr><td class="ref">${esc(d.created_at.slice(0,16).replace("T"," "))}</td><td><span class="chip ${d.outcome==="advance"?"good":d.outcome==="hold"||d.outcome==="rerun"?"warn":"bad"}">${d.outcome}</span></td>
      <td class="ref">${Object.entries(d.lineage).map(([k,v])=>`${esc(k)}=${esc(v)}`).join("<br>")}</td>
      <td>${d.reasons?d.reasons.map(r=>`<div>${esc(r)}</div>`).join(""):d.slices.filter(s=>s.outcome!=="advance").map(s=>`<div><b>${esc(s.measure_id)}</b> / ${esc(s.slice)}: ${esc(s.reason)}</div>`).join("")||"All slices within limits."}</td></tr>`).join("")}</table></div>`
    :`<div class="empty">No gate decisions yet. Wire <code>POST /v1/gates/evaluate</code> into CI so every prompt, model or pipeline change is judged before it ships.</div>`}</div>`;
}

/* ---------- routing ---------- */
const TABS=["overview","workflow","measures","cost","errors","failures","agents","learn","prompts","trace","alerts","gates","connect"];
// Hash is "#<tab>" or "#measures/<measure_id>" (the link alert notifications use).
function tab(){const h=location.hash.slice(1).split("/")[0];return TABS.includes(h)?h:"overview"}
function hashMeasure(){const p=location.hash.slice(1).split("/");return p[0]==="measures"&&p[1]?decodeURIComponent(p[1]):null}
async function render(){
  const t=tab(),hm=hashMeasure();
  if(t==="measures"&&hm&&hm!==S.measure){S.measure=hm;S.dim="";S.val=""}
  if(t==="measures"&&!hm)S.measure=null;
  const hp=location.hash.slice(1).split("/");if(t==="trace"&&hp[1]){S.trace.doc=decodeURIComponent(hp[1]);S.trace.step=hp[2]?decodeURIComponent(hp[2]):null}
  if(t==="workflow")S.wfStep=hp[1]?decodeURIComponent(hp[1]):null;
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  TABS.forEach(x=>$("#tab-"+x).hidden=x!==t);
  if(!S.overview&&!["gates","connect","failures","agents","learn","trace"].includes(t))return;
  try{
    if(t==="overview"){renderOverview();overviewFlow()}
    if(t==="workflow")await renderWorkflow();
    if(t==="measures")await (S.measure?renderMeasureDetail():renderMeasureGrid());
    if(t==="cost")await renderCost();
    if(t==="errors")await renderErrors();
    if(t==="failures")await renderFailures();
    if(t==="agents")await renderAgents();
    if(t==="learn")await renderLearn();
    if(t==="prompts")await renderPrompts();
    if(t==="trace")await renderTrace();
    if(t==="alerts")await renderAlerts();
    if(t==="gates")await renderGates();
    if(t==="connect")await renderConnect();
  }catch(e){$("#tab-"+t).innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-open]");if(!el)return;
  S.measure=el.dataset.open;S.dim=el.dataset.dim||"";S.val=el.dataset.val||"";
  const target="#measures/"+encodeURIComponent(S.measure);
  if(location.hash!==target)location.hash=target;else render();
  window.scrollTo({top:0});
});
window.addEventListener("hashchange",render);
$("#source").onchange=()=>{store.set("assay-source",src());S.measure=null;refresh()};
$("#run").onclick=async()=>{
  if(!src())return;const b=$("#run");b.disabled=true;b.textContent="Running…";
  try{await api("/v1/runs",{method:"POST",body:JSON.stringify({source:src(),days:+$("#days").value})});await refresh()}
  catch(e){$("#updated").textContent="Run failed: "+e.message}
  finally{b.disabled=false;b.textContent="Run now"}
};
$("#savekey").onclick=()=>{store.set("assay-key",$("#apikey").value);$("#keybox").hidden=true;boot()};
async function boot(){
  try{
    S.me=await api("/v1/whoami").catch(()=>null);
    if(S.me)$("#me").innerHTML=S.me.mode==="open"?`<span class="chip warn" title="No authentication: anyone who can reach this server can read and write">open mode</span>`
      :`<span class="chip neutral" title="${esc(S.me.name)}">${esc(S.me.tenant==="*"?"platform":S.me.tenant)} · ${esc(S.me.scopes.join(", "))}</span>`;
    const ms=await api("/v1/measures");ms.forEach(m=>S.catalog[m.id]=m);
    S.groups={};ms.forEach(m=>(S.groups[m.group||"Other"]??=[]).push(m.id));
    await loadSources();await refresh();
  }catch(e){renderEmpty(e.message)}
}
boot();
// Keep the overview live without a manual refresh.
setInterval(()=>{if(!document.hidden&&tab()==="overview"&&src())refresh()},60000);
</script>
</body>
