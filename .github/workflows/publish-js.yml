# Publishes the JavaScript SDK (sdk/js, "assay-evals" on npm) when a tag like js-v0.1.0 is pushed.
#
#   git tag js-v0.1.0 && git push origin js-v0.1.0
#
# Uses npm trusted publishing (OIDC): no token is stored anywhere. One-time setup:
#   1. The first version is published by hand, since npm only takes a trusted publisher for a
#      package that exists: `cd sdk/js && npm publish --access public` (after `npm login`).
#   2. npmjs.com → assay-evals → Settings → Trusted publishing → GitHub Actions:
#        owner tap222 · repository assay-evals · workflow publish-js.yml · environment npm
#   3. GitHub → Settings → Environments: create "npm", with yourself as a required reviewer.
name: Publish JS SDK

on:
  push:
    tags: ["js-v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write  # trusted publishing, and the package's provenance
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: The tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#js-v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag $TAG · package.json $PKG"
          test "$TAG" = "$PKG"
      - name: Test
        run: npm test
      - name: What goes in the package
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public --provenance
