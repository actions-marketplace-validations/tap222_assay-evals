# Runs the server's and the SDK's tests on every push to main and on every pull request,
# so a change is checked before it's merged, not only when a release is tagged.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The SDK from this commit, not the one on PyPI: a change to both is tested together.
        run: pip install -e sdk/python -e ".[dev]"
      - name: Test
        run: pytest -q

  other-os:
    # The same suite on macOS and Windows: `assay test` starts and stops your command there too.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: pip install -e sdk/python -e ".[dev]"
      - name: Test
        run: pytest -q

  js:
    # The JavaScript SDK (sdk/js): no dependencies, so nothing to install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Test
        working-directory: sdk/js
        run: npm test
